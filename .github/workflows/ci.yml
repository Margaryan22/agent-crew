name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: crew-contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crew-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crew-contract/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Generated files are up to date
        run: npm run check:generated

  plugin:
    name: plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace
        run: claude plugin validate . --strict
      - name: Validate the plugin
        run: claude plugin validate plugins/agent-crew --strict

  hooks:
    name: plugin tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies: hooks and the crew CLI use only Node built-ins and the committed contract bundle.
      - name: Hook, CLI and content tests
        run: node --test 'plugins/agent-crew/hooks/test/*.test.mjs' 'plugins/agent-crew/cli/test/*.test.mjs' 'plugins/agent-crew/test/*.test.mjs'

  template:
    name: tanstack template
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: plugins/agent-crew/templates/tanstack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/agent-crew/templates/tanstack/package-lock.json
      - run: npm ci
      # The database runs as a service container here instead of `npm run db:up`.
      - run: cp .env.example .env && npm run db:migrate && npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: '1'
      - run: npm run build

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: xvfb-run -a npm run test:integration
      - name: Integration tests (minimum VS Code version)
        run: xvfb-run -a npx vscode-test
        env:
          VSCODE_TEST_VERSION: '1.90.0'
      - name: Package (linux-x64)
        run: node scripts/package.mjs --target linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-ci-linux-x64
          path: extension/vsix/*.vsix
          retention-days: 7
