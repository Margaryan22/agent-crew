name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The agent-crew plugin lives in its own repository. Configure the repository variable
      # AGENT_CREW_PLUGIN_REPO (owner/name) and, for a private repo, the secret AGENT_CREW_PLUGIN_TOKEN.
      - name: Check out the agent-crew plugin
        if: vars.AGENT_CREW_PLUGIN_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.AGENT_CREW_PLUGIN_REPO }}
          ref: ${{ vars.AGENT_CREW_PLUGIN_REF || 'main' }}
          token: ${{ secrets.AGENT_CREW_PLUGIN_TOKEN || github.token }}
          path: .plugin

      - name: Choose the plugin source
        run: |
          if [ -f .plugin/.claude-plugin/plugin.json ]; then
            echo "AGENT_CREW_PLUGIN_DIR=$GITHUB_WORKSPACE/.plugin" >> "$GITHUB_ENV"
          else
            echo "::warning::AGENT_CREW_PLUGIN_REPO is not set — building against the test stub plugin."
            echo "AGENT_CREW_PLUGIN_DIR=$GITHUB_WORKSPACE/test/fixtures/agent-crew-stub" >> "$GITHUB_ENV"
            echo "CREW_ALLOW_STUB_PLUGIN=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Integration tests (minimum VS Code version)
        run: xvfb-run -a npx vscode-test
        env:
          VSCODE_TEST_VERSION: '1.90.0'

      - name: Package (linux-x64)
        run: node scripts/package.mjs --target linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-ci-linux-x64
          path: vsix/*.vsix
          retention-days: 7
